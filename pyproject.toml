[project]
name = "sazon-screening"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "openai>=1.50", "python-dotenv>=1", "tzdata", "pypdf>=5"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.57"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-xdist>=3", "streamlit>=1.57", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sazon", "sazon.demo", "screener"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live and not load'"
markers = ["live: calls the real Gemini API; skipped unless GEMINI_API_KEY is set",
           "load: runs hundreds of candidates against a real server; slow, run on its own (pytest -m load)"]
